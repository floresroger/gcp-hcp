# Disposable region PoC only: matches the existing upstream controller's broad
# workload permissions. Least-privilege refinement is HCP implementation work.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-spike-application-controller
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-spike-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-spike-application-controller
subjects:
  - kind: ServiceAccount
    name: gitops-argocd-application-controller
    namespace: argocd
