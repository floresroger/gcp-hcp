# Disposable Dev AIO REGION example only. No credential value is in this file.
# Region ESO KSA's direct Secret accessor grant was applied as a separate,
# approved Dev AIO preflight before any bootstrap source cutover.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gitops-bootstrap-global-gcpsm
spec:
  provider:
    gcpsm:
      projectID: gcp-hcp-commons-dev
      auth:
        workloadIdentity:
          clusterProjectID: dev-reg-us-c1-rflores0922
          clusterLocation: us-central1
          clusterName: dev-reg-us-c1-rflores0922-gke
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redhat-registry-pull-secret
  namespace: gitops-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops-bootstrap-global-gcpsm
    kind: ClusterSecretStore
  target:
    name: redhat-registry-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        labels:
          operator.argoproj.io/propagate-image-pull-secret: "true"
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: default-openshift-pull-secret
        decodingStrategy: None
