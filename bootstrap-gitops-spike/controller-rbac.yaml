# Disposable MC PoC only: mirror the existing application controller's
# wildcard workload permissions. Refine scope before a broader rollout.
# ServiceAccount name follows the operator's CR-name prefix; verify on-cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-spike-application-controller
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-spike-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-spike-application-controller
subjects:
  - kind: ServiceAccount
    name: gitops-argocd-application-controller
    namespace: argocd
