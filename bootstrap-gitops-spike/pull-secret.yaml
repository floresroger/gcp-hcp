# Phase 3 example for dev AIO MC ONLY. Not included by update.sh or applied.
# Verified: global secret exists as Docker config JSON, external-secrets SA has
# access, and the secret authenticates to the pinned registry.redhat.io image.
# A unique bootstrap store avoids depending on an Argo CD-managed store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gitops-bootstrap-global-gcpsm
spec:
  provider:
    gcpsm:
      projectID: gcp-hcp-commons-dev
      auth:
        workloadIdentity:
          clusterProjectID: dev-mgt-us-c1-rflores0922
          clusterLocation: us-central1
          clusterName: dev-mgt-us-c1-rflores0922-gke
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redhat-registry-pull-secret
  namespace: gitops-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops-bootstrap-global-gcpsm
    kind: ClusterSecretStore
  target:
    name: redhat-registry-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        labels:
          operator.argoproj.io/propagate-image-pull-secret: "true"
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: default-openshift-pull-secret
        decodingStrategy: None
