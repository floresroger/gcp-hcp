apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-1284-fixture-git-credentials
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gcp-1284-notifications
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: argocd-local-gcpsm
    kind: SecretStore
  target:
    name: gcp-1284-fixture-git-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
        annotations:
          client.lifecycle.config.k8s.io/mutation: ignore
      data:
        type: git
        url: git@github.com:openshift-online/gcp-hcp-infra.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: gcp-1284-fixture-git-key
